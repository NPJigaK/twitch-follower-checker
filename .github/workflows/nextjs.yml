# Build and deploy the static Next.js site to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Verify Yarn version and install policy
        shell: bash
        run: |
          test "$(yarn --version)" = "4.18.0"
          test "$(yarn config get approvedGitRepositories --json)" = "[]"
          test "$(yarn config get enableScripts --json)" = "false"
          test "$(yarn config get npmMinimalAgeGate --json)" = "1440"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify dependency resolutions
        run: yarn verify:dependencies

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Restore Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**/*.mdx', '**/*.css', 'next.config.mjs', 'tailwind.config.ts', 'theme.config.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('yarn.lock') }}-

      - name: Enable Corepack
        run: corepack enable

      - name: Verify Yarn version and install policy
        shell: bash
        run: |
          test "$(yarn --version)" = "4.18.0"
          test "$(yarn config get approvedGitRepositories --json)" = "[]"
          test "$(yarn config get enableScripts --json)" = "false"
          test "$(yarn config get npmMinimalAgeGate --json)" = "1440"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build static site and sitemap
        run: yarn build

      - name: Verify static artifact
        run: yarn verify:artifact

      - name: Preserve first build for reproducibility check
        if: github.event_name == 'pull_request'
        shell: bash
        run: mv out "$RUNNER_TEMP/first-static-export"

      - name: Rebuild static site and sitemap
        if: github.event_name == 'pull_request'
        run: yarn build

      - name: Verify rebuilt static artifact
        if: github.event_name == 'pull_request'
        run: |
          yarn verify:artifact
          yarn compare:artifacts "$RUNNER_TEMP/first-static-export" out

      - name: Install browsers for cross-browser regression tests
        run: yarn playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser and emulated-device regression tests
        run: yarn test:e2e

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Create IndexNow API key file
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          case "$INDEXNOW_KEY" in
            ""|*[!A-Za-z0-9-]*)
              echo "::error::INDEXNOW_KEY is missing or contains unsupported characters"
              exit 1
              ;;
          esac
          printf '%s' "$INDEXNOW_KEY" > "out/${INDEXNOW_KEY}.txt"

          mapfile -d '' txt_files < <(
            find out -maxdepth 1 -type f -name '*.txt' ! -name robots.txt -print0
          )
          if [ "${#txt_files[@]}" -ne 1 ] || \
            [ "${txt_files[0]}" != "out/${INDEXNOW_KEY}.txt" ] || \
            [ ! -s "${txt_files[0]}" ]
          then
            echo "::error::Unexpected IndexNow key artifact set"
            exit 1
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
