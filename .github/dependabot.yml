version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      # Keep these groups aligned with dependency-policy.json.
      ag-grid:
        applies-to: "version-updates"
        patterns:
          - "ag-grid-community"
          - "ag-grid-react"
        update-types:
          - "minor"
          - "patch"
      mui:
        applies-to: "version-updates"
        patterns:
          - "@mui/icons-material"
          - "@mui/material"
        update-types:
          - "minor"
          - "patch"
      next:
        applies-to: "version-updates"
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      nextra:
        applies-to: "version-updates"
        patterns:
          - "nextra"
          - "nextra-theme-docs"
        update-types:
          - "minor"
          - "patch"
      react:
        applies-to: "version-updates"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major migrations are planned and verified through dedicated issues.
      # update-types filters version updates only, not security updates.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Moving from the current prerelease to stable Nextra is tracked by #227.
      # Remove these version-only ignores after that migration is complete.
      - dependency-name: "nextra"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "nextra-theme-docs"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
